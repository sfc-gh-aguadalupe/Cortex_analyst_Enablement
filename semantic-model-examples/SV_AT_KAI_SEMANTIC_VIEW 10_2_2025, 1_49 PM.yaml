        synonyms:
          - calendar key
          - date id
          - sales date id
        description: Foreign key from the calendar table.
        expr: SALES_DATE_KEY
        data_type: NUMBER(8,0)
        unique: false
        sample_values:
          - '20181205'
          - '20241220'
          - '20250308'
      - name: UNIT_OF_MEASURE
        synonyms:
          - unit type
        description: Unit of measure in which quantity is expressed.
