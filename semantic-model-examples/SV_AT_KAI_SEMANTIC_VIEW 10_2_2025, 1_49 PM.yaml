          - 9de0556eaee606bf429b455f1f1ed491
      - name: HK_H_PRODUCT
        synonyms:
          - id of product
          - key of product
          - product id
          - product key
        description: Foreign key from the product table.
        expr: HK_H_PRODUCT
        data_type: VARCHAR(32) COLLATE 'en-ci'
        unique: false
        sample_values:
          - 30176eb3144b62eb0fc3bcd2471197bc
          - 326f5891e536c43c4fe4cf7ba66ba7c9
          - ebd36e0fba2c1cd30800e6d8772f3ef4
