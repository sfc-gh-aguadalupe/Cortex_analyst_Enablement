  - name: What is the net volume offtake?
    question: What is the net volume offtake?
    sql: |
      SELECT
          SUM(
              CASE 
                  WHEN UPPER(fo.unit_of_measure) IN ('PIECES', 'POUCHES', 'STICKS', 'PODS') THEN fo.quantity
                  WHEN UPPER(fo.unit_of_measure) = 'GRAMS' THEN 
                      CASE 
                          WHEN UPPER(LEFT(dp.product_number, 2)) IN ('FW', 'FG') THEN fo.quantity / 0.6
                          WHEN UPPER(LEFT(dp.product_number, 2)) = 'FF' THEN fo.quantity / 0.73
                          ELSE 0
                      END
                  ELSE 0
              END
          ) AS volume_net_offtake
      FROM 
          __fact_offtake_combined AS fo
      LEFT JOIN 
          __dim_product AS dp 
          ON fo.hk_h_product = dp.hk_h_product;
    use_as_onboarding_question: false
    verified_by: Joao Pereira
    verified_at: 1755690793
  - name: What is the split of IMS quantity per channel?
    question: What is the split of IMS quantity per channel?
    sql: |-
      WITH cte_fact_ims AS (
        SELECT
          hk_h_channel_id,
          quantity
        FROM __fact_ims
      ), cte_dim_channel AS (
        SELECT
          channel_description,
          hk_h_channel_id
        FROM __dim_channel
      )
      SELECT
        dc.channel_description,
        SUM(fims.quantity) AS ims_quantity
      FROM cte_fact_ims AS fims
      LEFT JOIN cte_dim_channel AS dc
        ON fims.hk_h_channel_id = dc.hk_h_channel_id
      GROUP BY
        dc.channel_description
      ORDER BY
        ims_quantity DESC NULLS LAST
    use_as_onboarding_question: false
    verified_by: Joao Pereira
    verified_at: 1756129204
  - name: |-
      What is a split of IMS for ZYN 20 and 21 per channel?
       
    question: |-
      What is a split of IMS for ZYN 20 and 21 per channel?
       
    sql: |-
      WITH cte_fact_ims AS (
        SELECT
          hk_h_channel_id,
          hk_h_product,
          quantity
        FROM __fact_ims
      ), cte_dim_product AS (
        SELECT
          brand_segment,
          hk_h_product
        FROM __dim_product
      ), cte_dim_channel AS (
        SELECT
          channel_description,
          hk_h_channel_id
        FROM __dim_channel
      ), ims_data AS (
        SELECT
          brand_segment,
          bc.channel_description,
          SUM(fi.quantity) AS total_ims
        FROM cte_fact_ims AS fi
        LEFT OUTER JOIN cte_dim_product AS dp
          ON fi.hk_h_product = dp.hk_h_product
        LEFT OUTER JOIN cte_dim_channel AS bc
          ON fi.hk_h_channel_id = bc.hk_h_channel_id
        WHERE
          dp.brand_segment IN ('ZYN 20', 'ZYN 21')
        GROUP BY
          bc.channel_description, dp.brand_segment
      )
      SELECT
        channel_description,
        brand_segment,
        total_ims
      FROM ims_data
      ORDER BY
        total_ims DESC NULLS LAST
    use_as_onboarding_question: false
    verified_by: Joao Pereira
    verified_at: 1756129288