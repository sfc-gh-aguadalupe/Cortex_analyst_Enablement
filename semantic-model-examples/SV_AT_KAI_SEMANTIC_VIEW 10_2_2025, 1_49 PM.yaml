  - name: FACT_IMS
    synonyms:
      - ims
      - sell-in
    description: |
      The ims table is a fact table containing details regarding ims,
      which refers to the PMI products that are sold to tobacconists.
      IMS stands for In Market Sales.
    base_table:
      database: DB_AT_PRD
      schema: PRESENTATION
      table: FACT_IMS
    dimensions:
      - name: BILLING_DOCUMENT
        synonyms:
          - document number
          - invoice number
        description: Unique identifier of the billing object.
        expr: BILLING_DOCUMENT
        data_type: VARCHAR(32) COLLATE 'en-ci'
        unique: false
        sample_values:
          - '4017962888'
          - '4024993457'
          - '4022311671'
      - name: BILLING_TYPE
        description: |
          Determines the type of billing. Can be used for example to  determine whether a record corresponds to sale or a return.
        expr: BILLING_TYPE
        data_type: VARCHAR(32) COLLATE 'en-ci'
        unique: false
        sample_values:
          - ZF1
          - ZF2
          - ZF3
          - ZRE
          - N/A
      - name: HK_H_CHANNEL_ID
        synonyms:
          - channel id
          - id of channel
          - key of channel
        description: Foreign key from the channel table.
        expr: HK_H_CHANNEL_ID
        data_type: NUMBER(38,0)
        unique: false
        sample_values:
          - '1'
          - '4'
          - '10'
          - '12'
      - name: HK_H_CUSTOMER
        synonyms:
          - customer id
          - customer key
          - id of customer
          - key of customer
        description: Foreign key from the customer table.
        expr: HK_H_CUSTOMER
        data_type: VARCHAR(32) COLLATE 'en-ci'
        unique: false
        sample_values:
