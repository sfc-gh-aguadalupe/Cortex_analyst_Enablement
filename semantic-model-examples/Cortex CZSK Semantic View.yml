name: CZSK_PILOT_SALE_CRM
tables:
  - name: CORTEX_ANALYST_PILOT_CRM
    synonyms:
      - '"CRM engagment"'
      - '"CRM performance"'
      - '"CRM"'
      - '"email engagement"'
      - '"email performance"'
      - '"emails"'
    base_table:
      database: DB_CZSK_DP_QAS
      schema: DP_COMMON_LAYER
      table: CORTEX_ANALYST_PILOT_CRM
    dimensions:
      - name: EMAILNAME
        synonyms:
          - email_address
          - email_id
          - email_username
          - login_name
          - user_email
          - username
        description: Email campaign names for customer journey touchpoints.
        expr: EMAILNAME
        data_type: VARCHAR(16777216) COLLATE 'en-ci'
        sample_values:
          - CZ_MULTI-CATEGORY_EMAIL_CS_CX-0-90-JOURNEY__Day-75_gjigy142 - 20250707_221750_NEW
          - CZ_MULTI-CATEGORY_EMAIL_CS_CX-0-90-JOURNEY__Day-21_rkb917ib - 20250624_105656_NEW
          - CZ_MULTI-CATEGORY_EMAIL_CS_CX-0-90-JOURNEY__Day-1_r6wyybld_NEW
      - name: GIGYA_ID
        synonyms:
          - consumer_id
          - customer
          - lau
          - recipient
        description: Unique identifier for a user in the Gigya customer identity management platform.
        expr: GIGYA_ID
        data_type: VARCHAR(16777216) COLLATE 'en-ci'
        sample_values:
          - 8b65ac81df8e47328ebf9cd92d6f5e13
          - b8a1e839db594829bbfca4dcb306466b
          - ad173014b4a64aaf9449a45cf049f3c3
      - name: JOBID
        synonyms:
          - '"job id"'
          - '"send id"'
          - '"send_id"'
        description: Unique identifier for a job id of a communication sendout
        expr: JOBID
        data_type: VARCHAR(16777216) COLLATE 'en-ci'
        sample_values:
          - '1128685'
          - '1128687'
          - '1082322'
    time_dimensions:
      - name: SEND_DATE
        synonyms:
          - '"email send date"'
          - '"email sent date"'
          - dispatch_timestamp
          - email_dispatch_dateemail_send_date
          - email_dispatch_timestam
          - email_sent_on
          - event_date
          - send_timestamp
        description: Date on which the communication has been sent
        expr: SEND_DATE
        data_type: DATE
        sample_values:
          - '2025-05-27'
          - '2025-07-07'
          - '2025-05-04'
    facts:
      - name: EMAIL_BOUNCE
        synonyms:
          - bounced_email
          - email_failed_delivery
          - email_rejected
          - email_returned
          - undeliverable_email
        description: Indicates whether an email sent to the customer bounced or not, where 1 represents a bounced email and 0 represents a successfully delivered email.
        expr: EMAIL_BOUNCE
        data_type: NUMBER(1,0)
        access_modifier: public_access
        sample_values:
          - '1'
          - '0'
      - name: EMAIL_CLICK
        synonyms:
          - click_through
          - email_activation
          - email_interaction
          - email_response
          - link_click
        description: Indicates whether the customer clicked on a link in an email sent by the analyst.
        expr: EMAIL_CLICK
        data_type: NUMBER(1,0)
        access_modifier: public_access
        sample_values:
          - '1'
          - '0'
      - name: EMAIL_DELIVERED
        synonyms:
          - delivery_successful
          - email_arrived
          - email_received
          - email_successfully_delivered
          - message_delivered
        description: Indicates whether an email was successfully delivered to the recipient.
        expr: EMAIL_DELIVERED
        data_type: NUMBER(1,0)
        access_modifier: public_access
        sample_values:
          - '1'
          - '0'
      - name: EMAIL_OPEN
        synonyms:
          - email_opened
          - email_opens
          - email_read
          - email_viewed
          - opened_emails
        description: Indicates whether the email was opened by the recipient (1) or not (0).
        expr: EMAIL_OPEN
        data_type: NUMBER(1,0)
        access_modifier: public_access
        sample_values:
          - '1'
          - '0'
      - name: EMAIL_SENT
        synonyms:
          - '"emails sent to consumer"'
          - '"emails sent"'
        description: Number of emails sent to the consumer
        expr: EMAIL_SENT
        data_type: NUMBER(1,0)
        access_modifier: public_access
        sample_values:
          - '1'
      - name: EMAIL_UNSUBSCRIBED
        synonyms:
          - email_opt_out
          - email_unsubscribe_flag
          - opted_out_emails
          - unsubscribed_emails
          - unsubscribed_status
        description: Indicates whether the customer has unsubscribed from receiving emails.
        expr: EMAIL_UNSUBSCRIBED
        data_type: NUMBER(1,0)
        access_modifier: public_access
        sample_values:
          - '1'
          - '0'
  - name: CORTEX_ANALYST_PILOT_PROMOTIONS
    synonyms:
      - '"campaigns"'
      - '"promos"'
      - '"promotions"'
    base_table:
      database: DB_CZSK_DP_QAS
      schema: DP_COMMON_LAYER
      table: CORTEX_ANALYST_PILOT_PROMOTIONS
    dimensions:
      - name: ORDER_NO
        synonyms:
          - invoice_number
          - order_id
          - order_number
          - purchase_number
          - transaction_id
        description: Unique identifier for a promotion order.
        expr: ORDER_NO
        data_type: VARCHAR(16777216) COLLATE 'en-ci'
        sample_values:
          - CEGID_0GH0002510031
          - DCE2_1031822044
          - CEGID_04K0004810040
      - name: PROMO_CODES
        synonyms:
          - coupon_codes
          - discount_codes
          - offer_ids
          - promotion_ids
          - voucher_numbers
        description: List of unique promotion codes or offers provided to Cortex Analyst Pilot users, including loyalty program tiers, registration incentives, and hand-holding rewards.
        expr: PROMO_CODES
        data_type: ARRAY
        sample_values:
          - |-
            [
              "CZIQOSCLUBTIER100"
            ]
          - |-
            [
              "E-registration offer",
              "Registration Offer 2017"
            ]
          - |-
            [
              "LO_ Hand Holding reward CZ__IDI_ Hand Hoding program CZ"
            ]
      - name: PROMO_DESCRIPTIONS
        synonyms:
          - discount_explanations
          - offer_descriptions
          - promotion_explanations
          - promotional_details
          - sales_promotion_descriptions
        description: Description of promotions or offers provided to customers.
        expr: PROMO_DESCRIPTIONS
        data_type: ARRAY
        sample_values:
          - |-
            [
              "Coupon will provide 50% discount on cart"
            ]
          - '[]'
          - |-
            [
              "Odměna za doporučení",
              "Sleva na první IQOS 400Kč"
            ]
    primary_key:
      columns:
        - ORDER_NO
  - name: DIM_CONSUMER
    synonyms:
      - consumer_data
      - consumer_profile
      - consumers
      - customer_data
      - customer_dimension
      - customer_info
      - customer_table
    description: This table stores information about individual consumers, including their demographic details, registration information, and account status, providing a single source of truth for consumer data.
    base_table:
      database: DB_CZSK_PL_QAS
      schema: DBT_CZ_B2C
      table: DIM_CONSUMER
    dimensions:
      - name: CONSUMER_DWID
        synonyms:
          - '"consumer_id"'
          - '"customer_id"'
          - '"gigya id"'
          - consumer_id
          - customer_id
          - gigya_id
          - identity_identifier
          - persona_identifier
        description: Unique identifier for a consumer in the data warehouse.
        expr: CONSUMER_DWID
        data_type: NUMBER(18,0)
        sample_values:
          - '1047687'
          - '1047628'
          - '1047749'
      - name: CURRENT_AGE
        synonyms:
          - '"age of consumer"'
          - '"consumer age"'
          - '"current age"'
        description: The age of the consumer at the time of data collection or a specific point in time, representing their current age.
        expr: CURRENT_AGE
        data_type: NUMBER(17,0)
        sample_values:
          - '63'
          - '40'
          - '76'
      - name: GENDER
        synonyms:
          - biological_sex
          - demographic
          - male_female
          - personal_gender
          - sex
        description: The gender of the consumer, either Male or Female.
        expr: GENDER
        data_type: VARCHAR(16777216)
        sample_values:
          - Male
          - Female
      - name: GIGYA_ID
        description: Unique identifier of a consumer in form of GIGYA_ID
        expr: GIGYA_ID
        data_type: VARCHAR(16777216)
      - name: GLOBAL_OPT_IN
        synonyms:
          - '"global marketing opt-in"'
          - '"global opt-in"'
          - '"marketing opt-in"'
          - '"opt-in"'
        description: Global marketing opt-in of consumer. Indicates whether the consumer provided consent to receive a CRM communication
        expr: GLOBAL_OPT_IN
        data_type: NUMBER(1,0)
        sample_values:
          - '1'
          - '0'
      - name: IS_DELETED
        synonyms:
          - deleted_flag
          - is_archived
          - is_inactive
          - is_removed
          - record_status
        description: Indicates whether a consumer record/account has been deleted or not.
        expr: IS_DELETED
        data_type: NUMBER(1,0)
        sample_values:
          - '1'
          - '0'
    facts:
      - name: CONSUMERS
        synonyms:
          - consumers
          - LAUS
          - purchasers
        description: Number of consumers in consumer table
        expr: GIGYA_ID
        data_type: VARCHAR(16777216)
        access_modifier: public_access
        default_aggregation: 6
    primary_key:
      columns:
        - CONSUMER_DWID
    unique_keys:
      - columns:
          - GIGYA_ID
  - name: DIM_PRODUCT
    synonyms:
      - product_catalog
      - product_dimension
      - product_directory
      - product_info
      - product_master
      - product_table
    description: This table stores information about products, including their unique identifier, category, platform, brand, product group, name, version, color, packaging details, and update timestamps, serving as a single source of truth for product data.
    base_table:
      database: DB_CZSK_PL_QAS
      schema: DBT_CZ_B2C
      table: DIM_PRODUCT
    dimensions:
      - name: BRAND
        synonyms:
          - '"device type"'
          - label
          - maker
          - manufacturer
          - marque
          - nameplate
          - trademark
        description: The brand of the product, representing the distinct product lines offered by the company, such as VEEV NOW, IQOS, and HEETS, which are likely e-cigarette or heated tobacco product brands.
        expr: BRAND
        data_type: VARCHAR(16777216) COLLATE 'en-ci'
        sample_values:
          - VEEV NOW
          - VEEV NOW ULTRA
          - IQOS
          - HEETS
          - TEREA
          - FIIT
          - ILUMA
          - LIL
          - ZYN
      - name: CATEGORY
        synonyms:
          - '"'
          - '"product class"'
          - '"product kind"'
          - '"product_class"'
          - '"product_group"'
          - classification
          - p
          - product_class
        description: 'The category of the product, which can be one of the following: Accessories (e.g. cases, device doors, device rings), Device (e.g. IQOS,ILUMA,LIL,VEEV), or Consumables (e.g. TEREA,FIIT,HEETS, VEEV PODS, DELIA, LEVIA).'
        expr: CATEGORY
        data_type: VARCHAR(16777216) COLLATE 'en-ci'
        sample_values:
          - Device
          - Accessories
          - Consumables
        is_enum: false
      - name: CODE
        synonyms:
          - product code
          - product id
          - product identifier
          - product_code
        description: Primary key of dim_product
        expr: CODE
        data_type: VARCHAR(16777216) COLLATE 'en-ci'
        sample_values:
          - G0000578
          - G0000496
          - G0001297
      - name: COLOR
        synonyms:
          - chroma
          - colour
          - dye
          - hue
          - pigment
          - shade
          - tint
          - tone
        description: The color of the product.
        expr: COLOR
        data_type: VARCHAR(16777216) COLLATE 'en-ci'
        sample_values:
          - COOL MINT
          - NEW INDIGO
          - SAGE GREEN
      - name: NAME
        synonyms:
          - designation
          - item_name
          - product_label
          - product_name
          - product_title
        description: This column stores the names of various products offered by the company, including device accessories and bundles.
        expr: NAME
        data_type: VARCHAR(16777216) COLLATE 'en-ci'
        sample_values:
          - VEEV One Passion Fruit Kiwi Guava 1.8% 2 pods pack
          - LEVIA GLACIAL BEAT / BLUE PACK
          - IQOS ILUMA i PRIME Midnight Black Kit
      - name: PLATFORM
        synonyms:
          - ecosystem
          - environment
          - infrastructure
          - operating_system
          - os
          - system_type
          - tech_stack
        description: 'The PLATFORM dimension represents the type of product platform, which can be one of the following: P1, P4 disposable, or P5, indicating the specific product platform or category.'
        expr: PLATFORM
        data_type: VARCHAR(16777216) COLLATE 'en-ci'
        sample_values:
          - P1
          - P4 disposable
          - P5
      - name: PRODUCT_DWID
        synonyms:
          - product_id
          - product_identifier
          - product_key
          - product_reference_id
          - product_unique_id
        description: Unique identifier for a product in the data warehouse.
        expr: PRODUCT_DWID
        data_type: NUMBER(18,0)
        sample_values:
          - '182'
          - '161'
          - '160'
      - name: PRODUCT_GROUP
        synonyms:
          - product_category
          - product_family
          - product_line
          - product_segment
          - product_type
        description: This column stores the category or classification of a product, providing a way to group similar products together for analysis and reporting purposes.
        expr: PRODUCT_GROUP
        data_type: VARCHAR(16777216) COLLATE 'en-ci'
        sample_values:
          - VEEV NOW WATERMELON (bundle)
          - VEEV One Strawberry 2 pods pack
          - VEEV ONE PODS MAUVE (bundle)
      - name: UNIT
        synonyms:
          - measurement_unit
          - quantity_unit
          - unit_description
          - unit_name
          - unit_of_measurement
          - unit_type
        description: Unit of measurement for the product, indicating whether it is sold in Packs (PK), Pieces (PCE), or Containers (CT).
        expr: UNIT
        data_type: VARCHAR(16777216) COLLATE 'en-ci'
        sample_values:
          - PK
          - PCE
          - CT
      - name: VERSION
        synonyms:
          - build
          - edition
          - iteration
          - release
          - revision
          - update
        description: The VERSION column represents the specific iteration or release of a product, capturing the unique identifier or name assigned to each product variant, such as a software version number or a product line name.
        expr: VERSION
        data_type: VARCHAR(16777216) COLLATE 'en-ci'
        sample_values:
          - IQOS 3
          - VEEV INPRIME
          - lil SOLID 2.0
    facts:
      - name: PIECES_IN_PACKAGE
        synonyms:
          - items_per_pack
          - pack_size
          - package_quantity
          - quantity_per_package
          - units_per_package
        description: The number of individual items or units contained within a single package of a product.
        expr: PIECES_IN_PACKAGE
        data_type: NUMBER(38,5)
        access_modifier: public_access
        sample_values:
          - '20.00000'
          - '10.00000'
          - '100.00000'
    primary_key:
      columns:
        - PRODUCT_DWID
  - name: DIM_USER
    synonyms:
