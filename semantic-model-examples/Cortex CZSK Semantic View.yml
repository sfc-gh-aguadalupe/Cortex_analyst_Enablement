      - user_details
      - user_dimension
      - user_profile
      - user_table
      - users
    description: This table stores information about users, including their username, profile, name, and organizational details such as business region, territory, and channel, as well as their full-time equivalent (FTE) status. The table is designed to track changes to user information over time, with valid from and to timestamps indicating the period during which each set of attributes was applicable.
    base_table:
      database: DB_CZSK_PL_QAS
      schema: DBT_CZ_B2C
      table: DIM_USER
    dimensions:
      - name: CHANNEL
        synonyms:
          - '"direct retail"'
          - '"e-comm""e-commerce"'
          - communication_channel
          - distribution_channel
          - marketing_channel
          - medium
          - outlet
          - platform
          - sales_channel
        description: The CHANNEL dimension represents the different sales channels through which customers interact with the company, including direct retail, indirect retail with sales engineers, and sales force product ambassadors.
        expr: CHANNEL
        data_type: VARCHAR(16777216) COLLATE 'en-ci'
        sample_values:
          - Direct Retail
          - Indirect Retail w/ SE
          - SFP Ambassadors
      - name: USER_DWID
        synonyms:
          - dw_user_id
          - unique_user_id
          - user_id
          - user_identifier
          - user_key
          - user_reference_id
        description: Unique identifier for a user in the data warehouse.
        expr: USER_DWID
        data_type: NUMBER(18,0)
        sample_values:
          - '759571'
          - '759695'
          - '759733'
      - name: USERNAME
        synonyms:
          - purchased via
          - seller
          - user
        description: Unique identifier for a user in the system, typically used to track and analyze user-specific data.
        expr: USERNAME
        data_type: VARCHAR(16777216) COLLATE 'en-ci'
        sample_values:
          - CZ0002482616
          - CZ0002483300
          - CZ0002483533
    primary_key:
      columns:
        - USER_DWID
  - name: FACT_KIT_PURCHASE
    synonyms:
      - '"purchased devices"'
      - '"purchased kits"'
      - devices
      - kits
    description: 'Contains information about sold kits/devices that covers P1 and P4 purchase data. '
    base_table:
      database: DB_CZSK_PL_QAS
      schema: DBT_CZ_B2C
      table: FACT_KIT_PURCHASE
    dimensions:
      - name: CONSUMER_DWID
        synonyms:
          - buyer_id
          - client_identifier
          - consumer_key
          - customer_id
          - user_id
        description: Surrogate key to connect a dimension. Automatically generated, changes with every load. Provides detailed information about the consumer who made the order.
        expr: CONSUMER_DWID
        data_type: NUMBER(18,0)
        sample_values:
          - '1208849'
          - '1026866'
          - '983778'
      - name: DATA_SOURCE
        synonyms:
          - data_origin
          - data_provenance
          - source_identifier
          - source_system
          - system_identifier
        description: Identificator of the source system. Indicates primary data source for obtaining the purchase data
        expr: DATA_SOURCE
        data_type: VARCHAR(16777216) COLLATE 'en-ci'
        sample_values:
          - DCE2 - Cegid
          - DCE2 - SDD Orders
          - Legacy - PurchaseData
      - name: ITEM_NUMBER
        synonyms:
          - item_code
          - item_id
          - item_identifier
          - item_key
          - order_item_number
          - product_item_number
        description: Identifier of an item within the order. Mandatory field.
        expr: ITEM_NUMBER
        data_type: NUMBER(38,0)
        sample_values:
          - '1'
          - '2'
          - '3'
      - name: KIT_PURCHASE_DWID
        synonyms:
          - kit_purchase_id
          - kit_purchase_identifier
          - kit_purchase_key
          - kit_purchase_surrogate_key
          - kit_purchase_unique_id
        description: Primary key of the fact table. Automatically generated, changes with every load.
        expr: KIT_PURCHASE_DWID
        data_type: NUMBER(18,0)
        sample_values:
          - '87005'
          - '953956'
          - '436837'
      - name: OPT_IN_ON_TRANSACTION
        synonyms:
          - consumer_opt_in_status
          - opted_in_at_transaction
          - opted_in_during_transaction
          - transaction_opt_in
          - transaction_opt_in_flag
        description: Flag if the consumer had opt-in at the time of the transaction.
        expr: OPT_IN_ON_TRANSACTION
        data_type: NUMBER(1,0)
        sample_values:
          - '1'
          - '0'
      - name: ORDER_NO
        synonyms:
          - order_id
          - order_identifier
          - order_reference
          - purchase_order_number
          - transaction_id
        description: Unique identifier of the order with the prefix of the data source. Mandatory field.
        expr: ORDER_NO
        data_type: VARCHAR(16777216) COLLATE 'en-ci'
        sample_values:
          - DMW_01257914
          - DMW_01258335
          - DMW_01259371
      - name: ORDER_REASON
        synonyms:
          - order_cause
          - order_description
          - order_explanation
          - order_purpose
          - reason_for_order
        description: "Contain a more granular description for an order in conjunction with the Order Type. Ex: Return to Sender: Lending Device. Following order reasons are known from the global documentation:\r\n\r\n| Reason Code | Description                                                                                                                                            |\r\n| ----------- | ------------------------------------------------------------------------------------------------------------------------------------------------------ |\r\n| R01         | Customer Order, Forward - Consumer orders                                                                                                              |\r\n| R03         | Replacement - Faulty Devices FITO, Replacement - Replacement of faulty devices                                                                         |\r\n| R04         | Replacement - Faulty Devices FOTI, Replacement - First old device received back from consumer, then new device given to consumer                       |\r\n| R05         | Replacement - Faulty Accessories FONI, Replacement - Replacement of faulty devices                                                                     |\r\n| R08         | Return - Online Sales, Return - First new device given to consumer, then old device back from consumer                                                 |\r\n| R09         | Return - Offline Sales, Return - Normally, applicable for holder and charger                                                                           |\r\n| R13         | Under Delivered - Corrective Delivery, Forward - First new accessory given to consumer, no product back from consumer                                  |\r\n| R14         | Under Delivered - Partial Refund, Return - Return of products originally purchased online with refund to consumer                                      |\r\n| R16         | Return to Sender - Consumer Order (R01), Return - Should be referenced to original e-Com order                                                         |\r\n| R23         | Return to Sender - Acessories FONI (R05), Return - In case of missing items in delivered order                                                         |\r\n| R26         | Return to Sender - Devices (R03 and R04), Return - Consumer accepts to get additional delivery of missing items                                        |\r\n| R27         | Paid Lending - Device kept by consumer.                                                                                                                |\r\n| R28         | Paid Lending - Return of lent device in case consumer decides not to keep lent device after lending period. To be referenced to original lending order |\r\n| R29         | Paid Lending - Lending order creation                                                                                                                  |\r\n| R30         | Return to Sender - Lending Order, In case original lending order cannot be delivered                                                                   |\r\n| R90         | Burning coupon, used by retailer when using a coupon                                                                                                   |"
        expr: ORDER_REASON
        data_type: VARCHAR(16777216) COLLATE 'en-ci'
        sample_values:
          - R01
          - R27
      - name: ORDER_TYPE
        synonyms:
          - order_category
          - order_classification
          - purchase_type
          - sales_order_type
          - transaction_type
        description: "Main type of the order. Following order types are known from the global documentation:\r\n\r\n| Code    | Description                         | Comment                                                                                            |\r\n| ------- | ----------------------------------- | -------------------------------------------------------------------------------------------------- |\r\n| FCD     | Field Coach Delivery                | Field Coach Delivery ( It is related to product transfer orders and not consumer sales orders )    |\r\n| IRD     | Indirect Retail Delivery            | Indirect Retail Delivery (These are consignment stock order AND NOT Consumer raised sales orders ) |\r\n| PPL_ZL2 | PPL Confirm Lending Order           | order type used only temporary before placeOrder happens.                                          |\r\n| PPL_ZLD | PPL Lending Order                   | order type used only temporary before placeOrder happens.                                          |\r\n| PPL_ZTA | PPL Sales Order                     | order type used only temporary before placeOrder happens.                                          |\r\n| ZAD     | Auto Delivery                       | Auto Delivery (INACTIVE)                                                                           |\r\n| ZBC     | Burning coupon Order                |                                                                                                    |\r\n| ZD2     | Debit Note - Successful payment     | Trade-in (INACTIVE)                                                                                |\r\n| ZD3     | Debit Note - Failed payment         | Trade-in (INACTIVE)                                                                                |\r\n| ZDE     | Device Link Order                   | by the retailer                                                                                    |\r\n| ZFG     | Sales Order With Free Goods         |                                                                                                    |\r\n| ZKL     | Replacement Order / Order for Free  |                                                                                                    |\r\n| ZL2     | Confirm Lending Order               | Consumer keeps goods                                                                               |\r\n| ZL3     | Transient Lending Order             | Consumer keeps goods without payment                                                               |\r\n| ZLD     | Lending Order                       | Consumer starts the lending journey, hasn't bought the device yet                                  |\r\n| ZLR     | Lending in Retailers                | ONLY for SAP                                                                                       |\r\n| ZRA     | Return Order                        |                                                                                                    |\r\n| ZRF     | Refund delivery order               | R14 Refund                                                                                         |\r\n| ZRS     | Corrective delivery order           | R13 Resend/reorder missing items                                                                   |\r\n| ZTA     | Sales Order                         |                                                                                                    |\r\n| ZTR     | Forward Order                       | Trade-in (INACTIVE .\"\"ZUP\"\" used instead)                                                          |\r\n| ZUP     | Replacement Upgrade, Trade-In       |                                                                                                    |"
