verified_queries:
  - name: P5 ZYN cans sold
    question: What is the number of ZYN (P5) cans sold in 2025
    sql: |-
      SELECT
        SUM(fs.quantity * dp.pieces_in_package) AS zyn_cans_sold
      FROM
        fact_sale AS fs
        JOIN dim_product AS dp ON fs.product_dwid = dp.product_dwid
      WHERE
        dp.platform = 'P5'
        AND dp.category = 'Consumables'
        AND DATE_PART('YEAR', fs.order_datetime) = 2025
        AND fs.reporting_qualified = 1
    use_as_onboarding_question: false
    verified_by: Josef Horak
    verified_at: 1757070777
  - name: What is the amount of VEEV pods sold in 2025 by platform and brand? (Include P4 disposable)
    question: What is the amount of VEEV pods sold in 2025 by platform and brand? (Include P4 disposable)
    sql: |-
      SELECT
        PLATFORM,
        BRAND,
        SUM(fs.quantity * dp.pieces_in_package) AS VEEV_PODS_SOLD
      FROM
        fact_sale AS fs
      JOIN dim_product AS dp ON fs.product_dwid = dp.product_dwid
      WHERE
        dp.platform in ('P4','P4 disposable')
        AND dp.category = 'Consumables'
        AND DATE_PART('YEAR', fs.order_datetime) = 2025
        AND fs.reporting_qualified = 1
      GROUP BY PLATFORM,BRAND
    use_as_onboarding_question: false
    verified_by: Josef Horak
    verified_at: 1755608154
  - name: What is the number of P1 consumables sold in 2025
    question: What is the number of P1 consumables sold in 2025
    sql: |-
      SELECT
        PLATFORM,
        BRAND,
        SUM(fs.quantity * dp.pieces_in_package) AS p1_sticks_volume_sold
      FROM
        fact_sale AS fs
      JOIN dim_product AS dp ON fs.product_dwid = dp.product_dwid
      WHERE
        dp.platform = 'P1'
        AND dp.category = 'Consumables'
        AND DATE_PART('YEAR', fs.order_datetime) = 2025
        AND fs.reporting_qualified = 1
      GROUP BY PLATFORM,BRAND
    use_as_onboarding_question: false
    verified_by: Josef Horak
    verified_at: 1755608240
  - name: What is the number of P1 devices sold in 2025 by brand?
    question: What is the number of P1 devices sold in 2025 by brand?
    sql: |-
      SELECT
        BRAND,
        SUM(fs.quantity) AS p1_devices_sold
      FROM
        fact_sale AS fs
      JOIN dim_product AS dp ON fs.product_dwid = dp.product_dwid
      WHERE
        dp.platform = 'P1'
        AND dp.category = 'Device'
        AND DATE_PART('YEAR', fs.order_datetime) = 2025
        AND fs.reporting_qualified = 1
      GROUP BY BRAND
    use_as_onboarding_question: false
    verified_by: Josef Horak
    verified_at: 1755608326
  - name: What is the AVG email open rate of email recipients?
    question: What is the AVG email open rate of email recipients?
    sql: |-
      SELECT 
          AVG(EMAIL_OR) AS AVG_EMAIL_OPEN_RATE
      FROM (
          SELECT
              GIGYA_ID,
              SUM(EMAIL_OPEN)/NULLIF(NULLIF(SUM(EMAIL_DELIVERED), 0), 0) AS EMAIL_OR
          FROM CORTEX_ANALYST_PILOT_CRM
          GROUP BY GIGYA_ID
      )
    use_as_onboarding_question: false
    verified_by: Josef Horak
    verified_at: 1755612721
  - name: What is a email open rate of all emails sent?
    question: What is a email open rate of all emails sent?
    sql: |-
      SELECT
              SUM(EMAIL_OPEN)/NULLIF(NULLIF(SUM(EMAIL_DELIVERED), 0), 0) AS EMAIL_OR
      FROM CORTEX_ANALYST_PILOT_CRM
    use_as_onboarding_question: false
    verified_by: Josef Horak
    verified_at: 1755612772
  - name: What is number of opted-in consumers (global_opt_in) in consumer database? This number includes all consumers including leads (consumers without purchase)
    question: What is number of opted-in consumers (global_opt_in) in consumer database? This number includes all consumers including leads (consumers without purchase)
    sql: |-
      SELECT
        COUNT(DISTINCT consumer_dwid) AS opted_in_consumers
      FROM
        dim_consumer
      WHERE
        global_opt_in = 1
        AND is_deleted = 0
    use_as_onboarding_question: false
    verified_by: Josef Horak
    verified_at: 1755613864
  - name: What are the top 5 promotions in terms of number of unique orders created with it?
    question: What are the top 5 promotions in terms of number of unique orders created with it?
    sql: WITH exploded AS (SELECT s.order_no, CAST(f.value AS TEXT) AS promo_code FROM __fact_sale AS s JOIN __cortex_analyst_pilot_promotions AS p ON s.order_no = p.order_no, LATERAL FLATTEN(input => p.promo_codes) AS f(seq, key, path, index, value, this)) SELECT promo_code, COUNT(DISTINCT order_no) AS unique_orders FROM exploded GROUP BY promo_code ORDER BY unique_orders DESC LIMIT 5
    use_as_onboarding_question: false
    verified_by: Josef Horak
    verified_at: 1755764273
  - name: Calculate number of purchasers between '2017-09-01' and '2017-12-31'
    question: Calculate number of purchasers between '2017-09-01' and '2017-12-31'
    sql: |-
      SELECT
        COUNT(DISTINCT fs.consumer_dwid) AS UNIQUE_PURCHASERS
      FROM
        fact_sale AS fs
      WHERE
        fs.order_datetime::date BETWEEN '2017-09-01'
        AND '2017-12-31'
    use_as_onboarding_question: false
    verified_by: Josef Horak
    verified_at: 1755780835
  - name: What is the number of kit sales between January 1st and May 1st 2025?
    question: What is the number of kit sales between January 1st and May 1st 2025?
    sql: |-
      SELECT COUNT(*) AS KIT_SALES
      FROM FACT_KIT_PURCHASE
      WHERE order_datetime::date BETWEEN '2025-01-01' AND '2025-05-01'
    use_as_onboarding_question: false
