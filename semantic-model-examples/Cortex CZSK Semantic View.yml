custom_instructions: "For sales related data: \n\n• When asked for sales, number of sold products or purchases calculate following outputs: number of unique orders, number of unique purchasers and sold goods (quantity * pieces_in_package)\t\n• When analyzing number of sales from FACT_SALE always apply condition reporting_qualified = 1 unless return orders and incomplete orders are expected\n•\tWhen analyzing number device or kit sales use table FACT_KIT_PURCHASE and apply condition DIM_PRODUCT.CATEGORY = ‘Device’\n•\tWhen analyzing consumable, sticks, pods, pack or bundle sales use table FACT_SALE and apply condition DIM_PRODUCT.CATEGORY = ‘Consumables’\n•\tWhen analyzing accessories sales use table FACT_SALE and apply condition DIM_PRODUCT.CATEGORY = ‘Accessories’\n•\tWhen analyzing consumables sales calculate the volume by default as SUM(quantity*pieces_in_package) and provide the disclaimer that volume has been calculated in P1 sticks and P4 pods\n•\tWhen analyzing consumable sales never combine different DIM_PRODUCT.PLATFORM values and always split the volumes by DIM_PRODUCT.PLATFORMS\n•\tWhen calculating number of sold P4 consumables consider platform in ('P4','P4 disposable') \n•\tWhen calculating number of sold packs filter unit = 'PK' in DIM_PRODUCT \n•\tWhen calculating number of sold bundles or cartons filter unit = 'CT' in DIM_PRODUCT\n•\tWhen calculating number of sold P4 consumables consider platform in ('P4','P4 disposable')\n•\tWhen calculating number of sold products never combine different product categories (devices and consumables)\n•\tWhen working with order_datetime convert the datetime to date\n\n\nFor CRM related data: \n•\tWhen calculating email delivery rate calculate it as SUM(EMAIL_DELIVERED)/SUM(EMAIL_SENT)\n•\tWhen calculating email open rate (Email OR) calculate it as SUM(EMAIL_OPEN)/SUM(EMAIL_DELIVERED)\n•\tWhen calculating email click rate (Email CTR) calculate it as SUM(EMAIL_CLICK)/SUM(EMAIL_DELIVERED)\n•\tWhen calculating email click to open rate (Email CTOR) calculate it as SUM(EMAIL_CLICK)/SUM(EMAIL_OPEN)\n\n\nFor promotion related data:\n\n•\tWhen working with table CORTEX_ANALYST_PILOT_PROMOTIONS prioritize the column PROMO_CODES\nFor consumer or LAU related data:\n•\tWhen analyzing consumer profile of consumers in database always apply condition DIM_CONSUMER.IS_DELETED = 0\n•\tConsumer age refers to attribute CURRENT_AGE in DIM_CONSUMER\n\nGeneral:\n\n•\tDevice tenure refers to time since purchase of the device till the current date\n"