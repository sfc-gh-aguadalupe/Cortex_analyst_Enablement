custom_instructions: |-
  PRODUCTION SQL GENERATION GUIDELINES:

  DATA QUALITY AND FILTERING:
  - Default filter: DATA_QUALITY_DESC IN ('Real', 'Draft') for operational analysis
  - Use 'Simulated' data only for market sizing or competitive analysis
  - Always filter to STATUS_NAME = 'Active' for current business performance
  - Apply IS_REAL_POS = 'Y' filter when excluding reference locations

  NULL VALUE HANDLING (CRITICAL):
  - RSP_AMOUNT: 15% null rate - ALWAYS use CASE WHEN RSP_AMOUNT IS NOT NULL for revenue calculations
  - CUSTOMER_ID: 100% null - DO NOT use in queries
  - KEY_ACCOUNT_NAME: 81% null - use COALESCE or explicit null handling
  - IATA_CODE: 53% null - only use when analyzing airport/travel retail
  - Geographic coordinates: Use WHERE clauses to filter nulls for spatial analysis

  REVENUE CALCULATIONS:
  - Standard formula: CASE WHEN RSP_AMOUNT IS NOT NULL THEN VOLUME * RSP_AMOUNT ELSE 0 END
  - Weighted average price: SUM(VOLUME * RSP_AMOUNT) / NULLIF(SUM(VOLUME WHERE RSP_AMOUNT IS NOT NULL), 0)
  - Always handle division by zero with NULLIF

  GEOGRAPHIC ANALYSIS:
  - Use VP_REGION_NAME for regional reporting
  - IATA_CODE identifies airport/travel retail locations
  - DEPARTURE_ARRIVAL values: D=Departure, A=Arrival, B=Both

  PREMIUM PRODUCT ANALYSIS:
  - Premium products: PRICE_CLASS IN ('Premium', 'Above Premium')
  - Calculate premium mix: Premium Volume / Total Volume * 100
  - Use for portfolio analysis and margin analysis

  TEMPORAL ANALYSIS:
  - Data covers limited date range - verify DATE range before analysis
  - Use MONTH(DATE), QUARTER(DATE) for derived time dimensions
  - Apply LAG/LEAD window functions for period-over-period comparisons

  BUSINESS TERMINOLOGY:
  - POV = Point of Sale

  JOIN PATTERNS:
  - CORTX_RSP_CALC to CORTX_DIM_POV: ON POV_ID (location details)
  - CORTX_RSP_CALC to CORTX_DIM_SELMA: ON POV_ID, CR_BRAND_ID, PRODUCT_CATEGORY_CODE (product attributes)
  - Always use LEFT OUTER joins to preserve fact table records

  PERFORMANCE OPTIMIZATION:
  - Filter early in WHERE clause before joins
  - Use appropriate aggregation levels before joining dimensions
  - Consider LIMIT clauses for large result sets
  - Group by meaningful business dimensions

  FORMATTING AND PRESENTATION:
  - Round financial amounts to 2 decimal places
  - Round percentages to 1 decimal place
  - Format large numbers with appropriate scaling (K, M, B)
  - Use meaningful column aliases for business users

  QUESTION CATEGORIZATION - ACCEPT:
  - Sales performance and revenue analysis questions
  - Geographic and market performance comparisons
  - Product portfolio and innovation analysis
  - Brand and TMO competitive analysis
  - Travel retail and channel performance
  - Data quality and operational metrics
  - Time-based trends and growth analysis
  - Premium product and pricing analysis

  QUESTION CATEGORIZATION - REDIRECT:
  - Individual customer personal data → aggregate performance metrics