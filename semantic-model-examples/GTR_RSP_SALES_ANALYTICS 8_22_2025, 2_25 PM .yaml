    left_table: CORTX_DIM_SELMA
    right_table: CORTX_DIM_POV
    relationship_columns:
      - left_column: POV_ID
        right_column: POV_ID
    relationship_type: many_to_one
    join_type: left_outer
  - name: SALES_TO_LOCATION
    left_table: CORTX_RSP_CALC
    right_table: CORTX_DIM_POV
    relationship_columns:
      - left_column: POV_ID
        right_column: POV_ID
    relationship_type: many_to_one
    join_type: left_outer
  - name: SALES_TO_PRODUCT
    left_table: CORTX_RSP_CALC
    right_table: CORTX_DIM_SELMA
    relationship_columns:
      - left_column: POV_ID
        right_column: POV_ID
      - left_column: CR_BRAND_ID
        right_column: CR_BRAND_ID
      - left_column: PRODUCT_CATEGORY_CODE
        right_column: PRODUCT_CATEGORY_CODE
    relationship_type: many_to_one
    join_type: left_outer
verified_queries:
  - name: performance_dashboard
    question: What is the overall business performance by region and product category?
    sql: |
      SELECT 
        p.VP_REGION_NAME,
        r.PRODUCT_CATEGORY_NAME,
        SUM(r.VOLUME) as TOTAL_VOLUME,
        SUM(CASE WHEN r.RSP_AMOUNT IS NOT NULL THEN r.VOLUME * r.RSP_AMOUNT ELSE 0 END) as TOTAL_REVENUE,
        COUNT(DISTINCT r.POV_ID) as LOCATION_COUNT,
        COUNT(DISTINCT r.CR_BRAND_ID) as PRODUCT_COUNT,
        (SUM(CASE WHEN s.IS_NTD = 1 THEN r.VOLUME ELSE 0 END) / NULLIF(SUM(r.VOLUME), 0)) * 100 as INNOVATION_PENETRATION_PCT
      FROM CORTX_RSP_CALC r
      JOIN CORTX_DIM_POV p ON r.POV_ID = p.POV_ID
      LEFT JOIN CORTX_DIM_SELMA s ON r.POV_ID = s.POV_ID AND r.CR_BRAND_ID = s.CR_BRAND_ID AND r.PRODUCT_CATEGORY_CODE = s.PRODUCT_CATEGORY_CODE
      WHERE r.DATA_QUALITY_DESC IN ('Real', 'Draft')
        AND p.STATUS_NAME = 'Active'
      GROUP BY p.VP_REGION_NAME, r.PRODUCT_CATEGORY_NAME
      ORDER BY TOTAL_REVENUE DESC
    use_as_onboarding_question: true
  - name: ntd_portfolio_tracking
    question: How are our NTD products performing across markets?
    sql: |
      SELECT 
        p.DF_MARKET_NAME,
        s.BRAND_FAMILY_NAME,
        CASE WHEN s.IS_NTD = 1 THEN 'NTD' ELSE 'Traditional' END as PRODUCT_TYPE,
        COUNT(DISTINCT s.CR_BRAND_ID) as SKU_COUNT,
        SUM(r.VOLUME) as TOTAL_VOLUME,
        SUM(CASE WHEN r.RSP_AMOUNT IS NOT NULL THEN r.VOLUME * r.RSP_AMOUNT ELSE 0 END) as TOTAL_REVENUE,
        AVG(r.RSP_AMOUNT) as AVG_PRICE,
        (SUM(r.VOLUME) / SUM(SUM(r.VOLUME)) OVER (PARTITION BY p.DF_MARKET_NAME)) * 100 as MARKET_SHARE_PCT
      FROM CORTX_RSP_CALC r
      JOIN CORTX_DIM_POV p ON r.POV_ID = p.POV_ID
      JOIN CORTX_DIM_SELMA s ON r.POV_ID = s.POV_ID AND r.CR_BRAND_ID = s.CR_BRAND_ID AND r.PRODUCT_CATEGORY_CODE = s.PRODUCT_CATEGORY_CODE
      WHERE r.DATA_QUALITY_DESC IN ('Real', 'Draft')
        AND p.STATUS_NAME = 'Active'
      GROUP BY p.DF_MARKET_NAME, s.BRAND_FAMILY_NAME, s.IS_NTD
      ORDER BY p.DF_MARKET_NAME, TOTAL_REVENUE DESC
  - name: travel_retail_performance
    question: Which airports and travel retail locations are top performers?
    sql: |
      SELECT 
        p.IATA_CODE,
        p.POV_NAME,
        p.LOCATION_NAME,
        p.DF_MARKET_NAME,
        p.DEPARTURE_ARRIVAL,
        SUM(r.VOLUME) as TOTAL_VOLUME,
        SUM(CASE WHEN r.RSP_AMOUNT IS NOT NULL THEN r.VOLUME * r.RSP_AMOUNT ELSE 0 END) as TOTAL_REVENUE,
        COUNT(DISTINCT r.CR_BRAND_ID) as PRODUCT_COUNT,
        AVG(r.RSP_AMOUNT) as AVG_PRICE
      FROM CORTX_RSP_CALC r
      JOIN CORTX_DIM_POV p ON r.POV_ID = p.POV_ID
      WHERE r.DATA_QUALITY_DESC IN ('Real', 'Draft')
        AND p.IATA_CODE IS NOT NULL
        AND p.STATUS_NAME = 'Active'
      GROUP BY p.IATA_CODE, p.POV_NAME, p.LOCATION_NAME, p.DF_MARKET_NAME, p.DEPARTURE_ARRIVAL
      ORDER BY TOTAL_REVENUE DESC
      LIMIT 50
  - name: tmo_competitive_analysis
    question: What is the competitive landscape by TMO?
    sql: |
      WITH tmo_performance AS (
        SELECT 
          r.TMO_NAME,
          SUM(r.VOLUME) as TOTAL_VOLUME,
          SUM(CASE WHEN r.RSP_AMOUNT IS NOT NULL THEN r.VOLUME * r.RSP_AMOUNT ELSE 0 END) as TOTAL_REVENUE,
          COUNT(DISTINCT r.CR_BRAND_ID) as BRAND_COUNT,
          COUNT(DISTINCT r.POV_ID) as LOCATION_COUNT,
          AVG(r.RSP_AMOUNT) as AVG_PRICE
        FROM CORTX_RSP_CALC r
        WHERE r.DATA_QUALITY_DESC IN ('Real', 'Draft')
        GROUP BY r.TMO_NAME
      )
      SELECT 
        TMO_NAME,
        TOTAL_VOLUME,
        TOTAL_REVENUE,
        BRAND_COUNT,
        LOCATION_COUNT,
        AVG_PRICE,
        (TOTAL_VOLUME / SUM(TOTAL_VOLUME) OVER ()) * 100 as VOLUME_MARKET_SHARE_PCT,
        (TOTAL_REVENUE / SUM(TOTAL_REVENUE) OVER ()) * 100 as REVENUE_MARKET_SHARE_PCT
      FROM tmo_performance
      ORDER BY TOTAL_REVENUE DESC
  - name: Show me the total sales for Italy over the entire available time period.
    question: Show me the total sales for Italy over the entire available time period.
    sql: |-
      WITH sales_data AS (
        SELECT
          c.date,
          c.volume,
          c.rsp_amount
        FROM
          cortx_rsp_calc AS c
          LEFT OUTER JOIN cortx_dim_pov AS p ON c.pov_id = p.pov_id
        WHERE
          c.data_quality_desc IN ('Real', 'Draft')
          AND p.status_name = 'Active'
          AND p.is_real_pos = 'Y'
          AND p.df_market_name = 'Italy'
      )
      SELECT
        MIN(date) AS start_date,
        MAX(date) AS end_date,
        SUM(
          CASE
            WHEN NOT rsp_amount IS NULL THEN volume * rsp_amount
            ELSE 0
          END
        ) AS total_sales
      FROM
        sales_data
    use_as_onboarding_question: false
    verified_by: Andre El Khoury
    verified_at: 1755866108
